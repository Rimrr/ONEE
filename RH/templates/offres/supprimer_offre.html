
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmer la suppression | ONEE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0066b3;
            --primary-dark: #005599;
            --primary-light: #e6f2fa;
            --error: #e63946;
            --error-light: #fee2e2;
            --dark: #2d3748;
            --light: #f8f9fa;
            --border-radius: 8px;
            --box-shadow: 0 4px 20px rgba(0, 102, 179, 0.15);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark);
        }

        .confirmation-container {
            max-width: 500px;
            margin: 3rem auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            text-align: center;
        }

        .confirmation-header {
            background: linear-gradient(135deg, var(--error), #f87171);
            color: white;
            padding: 1.5rem;
            position: relative;
        }

        .confirmation-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .confirmation-body {
            padding: 2rem;
        }

        .confirmation-message {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .confirmation-message strong {
            color: var(--primary);
            font-weight: 600;
        }

        .warning-icon {
            font-size: 3rem;
            color: var(--error);
            margin-bottom: 1rem;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-danger {
            background: var(--error);
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.2);
        }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .confirmation-container {
                margin: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="confirmation-header">
            <h2>
                <i class="fas fa-exclamation-triangle"></i>
                Confirmer la suppression
            </h2>
        </div>
        
        <div class="confirmation-body">
            <div class="warning-icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            
            <p class="confirmation-message">
                Vous êtes sur le point de supprimer définitivement l'offre :<br>
                <strong>{{ offre.titre }}</strong>
            </p>
            
            <p class="confirmation-message">
                Cette action est irréversible. Voulez-vous vraiment continuer ?
            </p>
            
            <form method="post" class="confirmation-form">
                {% csrf_token %}
                <div class="action-buttons">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash-alt"></i> Oui, supprimer
                    </button>
                    <a href="{% url 'liste_offres' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
{% endblock %}
